name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: shellcheck scripts/pr-sentinel-watch.sh scripts/alloc-queue-id.sh

  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover tests

  backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint the backlog as it would land on the base branch
        run: python3 scripts/queue.py lint
      # --strict makes an unreadable remote or merge base fatal rather than a
      # silent skip. Safe here and only here: CI always has both, and the run
      # on #91 confirmed the check reaches the remote instead of skipping.
      - name: Every id this branch adds holds a claim on the remote
        run: python3 scripts/queue.py claims --strict
      - name: Publish the ordered backlog
        if: always()
        run: python3 scripts/queue.py render --format table --all >> "$GITHUB_STEP_SUMMARY"
